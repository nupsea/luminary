<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luminary</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf8;
        --fg: #1c1a17;
        --muted: #6b665e;
        --line: #e6e2db;
        --accent: #b4703a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16150f;
          --fg: #f2efe8;
          --muted: #9a938a;
          --line: #2c2a24;
          --accent: #d99b5f;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
        display: grid;
        place-items: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: min(460px, 86vw); }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 2rem;
      }
      h1 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      /* The first thing anyone sees is a wait. Give them something worth
         reading instead of a spinner and the word "Starting". */
      figure { margin: 0 0 2.25rem; border-left: 2px solid var(--accent); padding-left: 1rem; }
      blockquote {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.55;
        letter-spacing: -0.005em;
      }
      figcaption {
        margin-top: 0.6rem;
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
      }
      p { color: var(--muted); margin: 0; min-height: 1.5em; font-size: 0.9rem; }
      .bar {
        margin: 1.75rem 0 0;
        height: 3px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 35%;
        border-radius: 3px;
        background: var(--accent);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(385%); }
      }
      /* Both panels are revealed by a class on <body>, so both must start
         hidden -- an omission here shows a bug report on a healthy startup. */
      .error,
      .consent {
        display: none;
        margin-top: 1.5rem;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.85rem 0.95rem;
        background: color-mix(in srgb, var(--bg) 80%, var(--fg) 4%);
      }
      .panel strong { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; color: var(--fg); }
      .panel p { margin: 0 0 0.6rem; font-size: 0.85rem; min-height: 0; }
      .panel code {
        display: block;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 8.5rem;
        overflow: auto;
        -webkit-user-select: text;
        user-select: text;
      }
      summary {
        font-size: 0.8rem;
        color: var(--muted);
        cursor: pointer;
        margin-bottom: 0.4rem;
      }
      .warning {
        display: none;
        margin-top: 0.6rem;
        font-size: 0.8rem;
        color: var(--accent);
      }
      .warning:not(:empty) { display: block; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      button {
        margin-top: 0.75rem;
        font: inherit;
        font-size: 0.85rem;
        padding: 0.35rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button.primary { border-color: var(--accent); color: var(--accent); }
      body.failed .bar,
      body.failed .warning { display: none; }
      body.failed .error { display: block; }
      body.consenting .error { display: none; }
      body.consenting .consent { display: block; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0-4 10.5c.6.7 1 1.4 1 2.5h6c0-1.1.4-1.8 1-2.5A6 6 0 0 0 12 3Z"/>
          <path d="M9 21h6"/>
        </svg>
        <h1>Luminary</h1>
      </div>

      <figure>
        <blockquote id="principle"></blockquote>
        <figcaption>How learning works</figcaption>
      </figure>

      <p id="message">Starting up</p>
      <p class="warning" id="warning"></p>
      <div class="bar"><span></span></div>

      <div class="error panel">
        <strong>Luminary could not start</strong>
        <p id="plain"></p>
        <details>
          <summary>Technical details</summary>
          <code id="detail"></code>
        </details>
        <div class="actions">
          <button id="retry" class="primary">Try again</button>
          <button id="report">Report this problem</button>
          <button id="copy">Copy details</button>
          <button id="reveal">Show log</button>
        </div>
      </div>

      <div class="consent panel">
        <strong>Report this to the Luminary developers?</strong>
        <p>
          Your browser will open a new GitHub issue with the text below already
          filled in. <strong>Nothing is sent until you press Submit there.</strong>
          File paths and any keys have been removed.
        </p>
        <code id="preview"></code>
        <div class="actions">
          <button id="consent-open" class="primary">Open GitHub</button>
          <button id="consent-cancel">Cancel</button>
        </div>
      </div>
    </main>
    <script type="module">
      const message = document.getElementById("message");
      const detail = document.getElementById("detail");

      // Same list and same day-of-year selection the SPA uses, so the line does
      // not change when the window navigates from here to the app.
      fetch("./principles.json")
        .then((r) => r.json())
        .then((lines) => {
          const now = new Date();
          const startOfYear = Date.UTC(now.getUTCFullYear(), 0, 0);
          const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
          const dayOfYear = Math.floor((today - startOfYear) / 86400000);
          document.getElementById("principle").textContent =
            lines[dayOfYear % lines.length];
        })
        .catch(() => {});

      const plain = document.getElementById("plain");
      const warning = document.getElementById("warning");
      const preview = document.getElementById("preview");
      const api = window.__TAURI__;

      const invoke = (cmd) =>
        api ? api.core.invoke(cmd) : Promise.reject(new Error("no boot API"));

      function fail(text, technical) {
        document.body.classList.add("failed");
        message.textContent = "Something went wrong";
        plain.textContent = text;
        detail.textContent = technical ?? text;
      }

      function render(payload) {
        if (!payload) return;
        if (payload.failed) {
          fail(payload.message, `${payload.step}: ${payload.detail || payload.message}`);
          return;
        }
        message.textContent = payload.message;
      }

      document.getElementById("retry").addEventListener("click", () => {
        document.body.classList.remove("failed");
        warning.textContent = "";
        message.textContent = "Trying again";
        invoke("retry_boot").catch((e) => fail("Luminary could not restart.", String(e)));
      });

      document.getElementById("copy").addEventListener("click", (event) => {
        // The redacted report, not the raw detail: this text gets pasted into
        // issues and chat windows.
        invoke("diagnostics")
          .then((text) => navigator.clipboard.writeText(text))
          .then(() => {
            event.target.textContent = "Copied";
          })
          .catch(() => navigator.clipboard.writeText(detail.textContent ?? ""));
      });

      document.getElementById("reveal").addEventListener("click", () => {
        invoke("reveal_log").catch((e) => fail("The log file could not be shown.", String(e)));
      });

      // Two steps on purpose. Nothing leaves the machine until the user has
      // seen exactly what would be sent and asked for it to be opened.
      document.getElementById("report").addEventListener("click", () => {
        invoke("diagnostics").then((text) => {
          preview.textContent = text;
          document.body.classList.add("consenting");
        });
      });

      document.getElementById("consent-cancel").addEventListener("click", () => {
        document.body.classList.remove("consenting");
      });

      document.getElementById("consent-open").addEventListener("click", () => {
        document.body.classList.remove("consenting");
        invoke("report_issue").catch((e) =>
          fail("The browser could not be opened. Use Copy details instead.", String(e))
        );
      });

      // Anything thrown here would leave the splash sitting on its first line
      // forever, which is indistinguishable from a slow start.
      if (!api) {
        fail(
          "Luminary could not start, and could not determine why.",
          "the boot API is unavailable to this window"
        );
      } else {
        let pushed = false;
        api.event.listen("boot", ({ payload }) => {
          pushed = true;
          render(payload);
        });
        api.event.listen("boot-warning", ({ payload }) => {
          warning.textContent = payload;
        });
        // Covers the boot steps that ran before the listener above existed.
        api.core
          .invoke("boot_state")
          .then((payload) => {
            if (!pushed) render(payload);
          })
          .catch((e) =>
            fail("Luminary could not start, and could not determine why.", String(e))
          );
      }
    </script>
  </body>
</html>
