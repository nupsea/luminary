<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luminary</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf8;
        --fg: #1c1a17;
        --muted: #6b665e;
        --line: #e6e2db;
        --accent: #b4703a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16150f;
          --fg: #f2efe8;
          --muted: #9a938a;
          --line: #2c2a24;
          --accent: #d99b5f;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
        display: grid;
        place-items: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: min(460px, 86vw); }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 2rem;
      }
      h1 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      /* The first thing anyone sees is a wait. Give them something worth
         reading instead of a spinner and the word "Starting". */
      figure { margin: 0 0 2.25rem; border-left: 2px solid var(--accent); padding-left: 1rem; }
      blockquote {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.55;
        letter-spacing: -0.005em;
      }
      figcaption {
        margin-top: 0.6rem;
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
      }
      p { color: var(--muted); margin: 0; min-height: 1.5em; font-size: 0.9rem; }
      .bar {
        margin: 1.75rem 0 0;
        height: 3px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 35%;
        border-radius: 3px;
        background: var(--accent);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(385%); }
      }
      .error {
        display: none;
        margin-top: 1.5rem;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.85rem 0.95rem;
        background: color-mix(in srgb, var(--bg) 80%, var(--fg) 4%);
      }
      .error strong { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; }
      .error code {
        display: block;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 8.5rem;
        overflow: auto;
        -webkit-user-select: text;
        user-select: text;
      }
      button {
        margin-top: 0.75rem;
        font: inherit;
        font-size: 0.85rem;
        padding: 0.35rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      body.failed .bar { display: none; }
      body.failed .error { display: block; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0-4 10.5c.6.7 1 1.4 1 2.5h6c0-1.1.4-1.8 1-2.5A6 6 0 0 0 12 3Z"/>
          <path d="M9 21h6"/>
        </svg>
        <h1>Luminary</h1>
      </div>

      <figure>
        <blockquote id="principle"></blockquote>
        <figcaption>How learning works</figcaption>
      </figure>

      <p id="message">Starting up</p>
      <div class="bar"><span></span></div>
      <div class="error">
        <strong>Luminary could not start</strong>
        <code id="detail"></code>
        <button id="copy">Copy details</button>
      </div>
    </main>
    <script type="module">
      const message = document.getElementById("message");
      const detail = document.getElementById("detail");

      // Same list and same day-of-year selection the SPA uses, so the line does
      // not change when the window navigates from here to the app.
      fetch("./principles.json")
        .then((r) => r.json())
        .then((lines) => {
          const now = new Date();
          const startOfYear = Date.UTC(now.getUTCFullYear(), 0, 0);
          const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
          const dayOfYear = Math.floor((today - startOfYear) / 86400000);
          document.getElementById("principle").textContent =
            lines[dayOfYear % lines.length];
        })
        .catch(() => {});

      const { listen } = window.__TAURI__.event;
      listen("boot", ({ payload }) => {
        if (payload.failed) {
          document.body.classList.add("failed");
          message.textContent = "Something went wrong";
          detail.textContent = `${payload.step}: ${payload.message}`;
          return;
        }
        message.textContent = payload.message;
      });

      document.getElementById("copy").addEventListener("click", () => {
        navigator.clipboard.writeText(detail.textContent ?? "");
      });
    </script>
  </body>
</html>
