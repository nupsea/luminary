# The platform-specific half of the shell lives in `host/`, which has no Tauri
# dependency and can therefore be checked for Windows from a Mac. See its
# crate docs -- `tauri-build` needs a resource compiler that macOS does not
# have, so nothing in this package can be compiled for Windows locally.
[workspace]
members = ["host"]

[package]
name = "luminary-desktop"
version = "0.11.2"
description = "Luminary"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
getrandom = "0.3"
luminary-host = { path = "host" }
percent-encoding = "2"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
