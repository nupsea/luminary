name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    steps:
      - name: Check Branch Name
        run: |
          BRANCH_NAME=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')
          if [[ ! $BRANCH_NAME =~ ^(feature\/|bugfix\/|hotfix\/|chore\/|docs\/|feat\/).+ ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not follow the convention (feature/..., bugfix/..., hotfix/..., chore/..., docs/..., feat/...)!"
            exit 1
          fi

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [branch-check]
    if: always() && (needs.branch-check.result == 'success' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run CI checks
        run: make ci

  # The desktop shell supervises the bundled backend and Ollama, and a defect
  # here bricks startup for every DMG user. It cannot be built on ubuntu, so
  # without this job it had no automated coverage at all.
  desktop-shell:
    runs-on: macos-14
    timeout-minutes: 20
    needs: [branch-check]
    if: always() && (needs.branch-check.result == 'success' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check formatting
        run: cd src-tauri && cargo fmt --check
      - name: Test and lint the desktop shell
        run: make desktop-test

  powershell-syntax:
    runs-on: ubuntu-latest
    needs: [branch-check]
    if: always() && (needs.branch-check.result == 'success' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v4
      # pwsh is preinstalled on ubuntu-latest; run the parser directly so a
      # missing pwsh fails the job rather than silently skipping.
      - name: Validate PowerShell scripts
        shell: pwsh
        run: ./scripts/check_powershell.ps1
