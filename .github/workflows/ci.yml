name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    steps:
      - name: Check Branch Name
        run: |
          BRANCH_NAME=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')
          if [[ ! $BRANCH_NAME =~ ^(feature\/|bugfix\/|hotfix\/|chore\/|docs\/|feat\/|fix\/|refactor\/|ci\/).+ ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not follow the convention (feature/..., bugfix/..., hotfix/..., chore/..., docs/..., feat/..., fix/..., refactor/..., ci/...)!"
            exit 1
          fi

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [branch-check]
    if: always() && (needs.branch-check.result == 'success' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run CI checks
        run: make ci

  # The desktop shell supervises the bundled backend and Ollama, and a defect
  # here bricks startup for every DMG user. It cannot be built on ubuntu, so
  # without this job it had no automated coverage at all.
  desktop-shell:
    runs-on: macos-14
    timeout-minutes: 20
    needs: [branch-check]
    if: always() && (needs.branch-check.result == 'success' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check formatting
        run: cd src-tauri && cargo fmt --check
      - name: Test and lint the desktop shell
        run: make desktop-test

  # The other half of `desktop-shell`, on the platform whose process model is
  # different rather than merely untested. Windows has no process groups
  # reachable from a GUI binary, so the supervisor kills a tree through a Job
  # Object instead -- and `host/tests/tree.rs` is the only place that mechanism
  # is ever *executed*. `cargo check` would prove the FFI compiles and nothing
  # about whether closing a job kills its members.
  #
  # This job and the code it compiles landed together. A Windows job pushed
  # ahead of the code that makes it pass is a known-red gate on master, which
  # teaches everyone to ignore the column.
  desktop-shell-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [branch-check]
    if: always() && (needs.branch-check.result == 'success' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build and test the desktop shell
        run: cargo test --workspace
      - name: Lint the desktop shell
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The support policy decides whether a host is offered a local model at all,
  # and it got Windows wrong for a whole release: `_has_accelerator` probed
  # /dev nodes that do not exist there, so every Windows machine resolved to
  # `no_accelerator` and every local call raised. Nothing could catch it --
  # ubuntu and macOS are the only runners, and `conftest` pins the verdict so a
  # suite cannot read its own hardware. Same argument as `desktop-shell`: code
  # that cannot run on ubuntu has no automated coverage without a job for it.
  #
  # Widened for 0.13.0's exit gate: `make ci` and `make smoke` green on
  # Windows. There is no `make` on windows-latest, so this runs the same
  # commands `make ci` runs rather than the target itself -- the ubuntu `ci`
  # job above is the one source of truth for what those commands are.
  # Deliberately still missing two pieces of `make ci`: `check_public_import.sh`
  # rebuilds a second uv environment at a hardcoded `/tmp/luminary-public-env`,
  # which is a Linux path under Git Bash's MSYS root rather than a Windows one,
  # and `check_powershell.sh` is already covered on Windows-authored intent by
  # the `powershell-syntax` job. The frontend steps (build/tsc/eslint/vitest)
  # stay ubuntu-only: Node's toolchain is not the platform seam this rung is
  # about, and running them twice would cost the job's time without teaching
  # anything ubuntu's `ci` job did not already prove.
  windows-host-policy:
    runs-on: windows-latest
    timeout-minutes: 50
    needs: [branch-check]
    if: always() && (needs.branch-check.result == 'success' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3765 tests do enough small-file I/O (SQLite, LanceDB, Kuzu, tmp_path
      # churn) that Defender's real-time scan turns this into a 2-3x tax: one
      # run finished pytest in 28m18s, an unrelated later run hit the timeout
      # at 83% with no code change that would explain a slowdown. Excluding
      # the checkout is the documented mitigation for exactly this on hosted
      # Windows runners.
      - name: Exclude the workspace from Defender's real-time scan
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # --frozen, because a lock that does not resolve on Windows is the defect
      # this job exists to surface -- not something to paper over by re-locking
      # on the runner. install.ps1 runs the same step on every Windows install.
      - name: Install backend dependencies
        run: uv sync --frozen

      - name: The app imports
        run: uv run python -c "import app.main"

      - name: ruff
        run: uv run ruff check .

      - name: Layer linter
        run: uv run python tools/layer_linter.py

      - name: Boundary checker
        run: uv run python tools/boundary_checker.py

      - name: Full backend suite, on the platform it got wrong
        run: uv run pytest

      - name: Manifest schema
        run: uv run python ../scripts/check_manifest_schema.py

      - name: Manifest coverage
        run: uv run python ../scripts/check_manifest_coverage.py

      - name: Public-surface calls
        run: uv run python ../scripts/check_public_surface_calls.py

      - name: Smoke script paths still exist in the API surface
        run: uv run python ../scripts/check_smoke_paths.py

  powershell-syntax:
    runs-on: ubuntu-latest
    needs: [branch-check]
    if: always() && (needs.branch-check.result == 'success' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v4
      # pwsh is preinstalled on ubuntu-latest; run the parser directly so a
      # missing pwsh fails the job rather than silently skipping.
      - name: Validate PowerShell scripts
        shell: pwsh
        run: ./scripts/check_powershell.ps1
