name: Desktop installers

# Builds the Windows setup .exe and the Linux AppImage and .deb, installs each on
# a clean runner and launches it. Separate from ci.yml: a build is most of an hour.
# No GPU on the runners, so this proves the install and the CPU path only.

on:
  workflow_dispatch:
  push:
    # Tags publish (path filters are ignored for tag pushes); naming only tags
    # would stop branch pushes from running it.
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "scripts/desktop/**"
      - "scripts/get-luminary.*"
      - "src-tauri/**"
      - ".github/workflows/desktop-installers.yml"

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # The oldest base with WebKitGTK 4.1: an AppImage runs only on a glibc at
    # least as new as the one it was built against.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The stage is copied twice more by the bundler (AppDir and the .deb tree).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf zstd xvfb imagemagick libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # No cache for build/pythons: restoring uv's reparse-point link breaks uv on Windows.

      - run: cd frontend && npm ci

      - name: Stage payload, runtime and inference server
        run: make stage

      - name: Verify the stage
        run: make verify-stage

      # NO_STRIP: linuxdeploy's strip fails on newer ELF sections. One bundle per step,
      # the .deb first, so an AppImage failure cannot hide it. --verbose: tauri hides
      # linuxdeploy's error otherwise.
      - name: Build the .deb
        env:
          NO_STRIP: "true"
        run: make desktop-installer TAURI_BUILD_FLAGS="--verbose --bundles deb"

      - name: Install the .deb and open it
        run: |
          deb="$(ls src-tauri/target/release/bundle/deb/*.deb)"
          LUMINARY_HOST_SUPPORTED=1 LUMINARY_INSTALLER="$deb" LUMINARY_FORMAT=deb LUMINARY_NO_LAUNCH=1 bash scripts/get-luminary.sh
          exe="$(dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep '^/usr/bin/' | head -1)"
          SCREENSHOT=build/linux-deb.png xvfb-run -a -s "-screen 0 1440x900x24" \
            bash scripts/desktop/verify_installed.sh "$exe"

      # Driver libraries belong to the host; the engine's runners are staged separately.
      - name: Build the AppImage
        if: ${{ !cancelled() }}
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libcuda.so.1;libnvidia-ml.so.1;libvulkan.so.1"
        run: make desktop-installer TAURI_BUILD_FLAGS="--verbose --bundles appimage"

      # Second launch, against the library the first one created.
      - name: Open the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          appimage="$(ls src-tauri/target/release/bundle/appimage/*.AppImage)"
          LUMINARY_HOST_SUPPORTED=1 LUMINARY_INSTALLER="$appimage" LUMINARY_FORMAT=appimage LUMINARY_NO_LAUNCH=1 bash scripts/get-luminary.sh
          SCREENSHOT=build/linux-appimage.png xvfb-run -a -s "-screen 0 1440x900x24" \
            bash scripts/desktop/verify_installed.sh "$HOME/.local/bin/luminary"

      # Removes both installs at once. The library the two launches built must survive:
      # an uninstall is not consent to delete it.
      - name: Uninstall through get-luminary.sh
        run: |
          mkdir -p build
          cp -f "$HOME/.local/state/luminary/luminary.log" build/linux-luminary.log || true
          set -o pipefail
          echo "not Luminary's" > ~/.local/state/luminary/keep-me.txt
          LUMINARY_UNINSTALL=1 bash scripts/get-luminary.sh | tee build/uninstall.out
          if dpkg-query -S /usr/bin/luminary-desktop 2>/dev/null; then echo "the .deb is still installed"; exit 1; fi
          for p in ~/.local/lib/luminary ~/.local/bin/luminary ~/.local/share/applications/luminary.desktop \
                   ~/.local/share/sh.luminary.app/engine ~/.local/state/luminary/luminary.log; do
            if [ -e "$p" ]; then echo "left behind: $p"; exit 1; fi
          done
          [ -f ~/.local/state/luminary/keep-me.txt ] || { echo "a file Luminary did not write was deleted"; exit 1; }
          grep -qxF "    delete: rm -rf $HOME/.local/state/luminary" build/uninstall.out || { echo "the kept folder was not listed"; exit 1; }
          [ -d ~/.local/share/sh.luminary.app ] || { echo "the library was deleted"; exit 1; }

      # The download size; printed, not gated (no known Linux ceiling).
      - name: Report installer sizes
        if: ${{ !cancelled() }}
        run: |
          du -sm build/stage | awk '{print "stage: " $1 "MB"}'
          ls -l src-tauri/target/release/bundle/deb/*.deb \
                src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null \
            | awk '{printf "%s: %.1fMB\n", $NF, $5/1048576}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: luminary-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          compression-level: 0

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luminary-linux-evidence
          path: |
            build/*.png
            build/*.log
            build/installed-app.out
            ~/.local/state/luminary/luminary.log
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Defender's real-time scan multiplies the job time over this many small files.
      - name: Exclude the build and install paths from Defender's real-time scan
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Luminary"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\sh.luminary.app"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\uv"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # No cache for build/pythons: restoring uv's reparse-point link breaks uv on Windows.

      - run: cd frontend && npm ci

      - name: Stage payload, runtime and inference server
        run: |
          bash scripts/desktop/stage_payload.sh
          bash scripts/desktop/stage_python.sh
          bash scripts/desktop/stage_ollama.sh

      - name: Verify the stage
        run: |
          bash scripts/desktop/verify_stage.sh
          bash scripts/desktop/verify_ollama.sh

      - name: Build the setup .exe
        run: cd src-tauri && ../frontend/node_modules/.bin/tauri build --verbose

      # Windows PowerShell 5.1, the shell a user's `irm | iex` runs in, not pwsh.
      # The runner has no GPU, so the host check is declared past as an operator would.
      # A fake user Ollama holds phi4-mini, which the app does not load by default: the
      # install must copy it and leave the user's files byte for byte as they were.
      - name: Install through get-luminary.ps1
        shell: powershell
        run: |
          $store = "$env:USERPROFILE\.ollama\models"
          $sha = [Security.Cryptography.SHA256]::Create()
          $layers = foreach ($body in @("weights", "template")) {
            $bytes = [Text.Encoding]::ASCII.GetBytes($body)
            $hex = -join ($sha.ComputeHash($bytes) | ForEach-Object { $_.ToString("x2") })
            New-Item -ItemType Directory -Force "$store\blobs" | Out-Null
            [IO.File]::WriteAllBytes("$store\blobs\sha256-$hex", $bytes)
            @{ digest = "sha256:$hex"; size = $bytes.Length }
          }
          New-Item -ItemType Directory -Force "$store\manifests\registry.ollama.ai\library\phi4-mini" | Out-Null
          @{ config = $layers[1]; layers = @($layers[0]) } | ConvertTo-Json -Depth 4 |
            Set-Content "$store\manifests\registry.ollama.ai\library\phi4-mini\latest"
          $before = Get-ChildItem "$store\blobs" | Get-FileHash | ForEach-Object { $_.Hash }

          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $env:LUMINARY_INSTALLER = $setup.FullName
          $env:LUMINARY_NO_LAUNCH = "1"
          $env:LUMINARY_HOST_SUPPORTED = "1"
          $env:LUMINARY_REUSE_MODELS = "1"
          ./scripts/get-luminary.ps1

          $ours = "$env:LOCALAPPDATA\sh.luminary.app\ollama\models"
          if (-not (Test-Path "$ours\manifests\registry.ollama.ai\library\phi4-mini\latest")) { throw "the model was not copied" }
          $copied = Get-ChildItem "$ours\blobs" | Get-FileHash | ForEach-Object { $_.Hash }
          if (Compare-Object $before $copied) { throw "the copies differ from the user's files" }
          $after = Get-ChildItem "$store\blobs" | Get-FileHash | ForEach-Object { $_.Hash }
          if (Compare-Object $before $after) { throw "the user's Ollama files changed" }
          if (Get-ChildItem "$ours\blobs" -Filter *.partial) { throw "a partial copy was left behind" }
          # The fake model must not reach the launch below.
          Remove-Item -Recurse -Force "$ours", "$env:USERPROFILE\.ollama"

      # Refused before anything runs: an older app may not open a library a newer one upgraded.
      - name: Refuse to install an older version over it
        shell: powershell
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $older = Join-Path $env:RUNNER_TEMP "Luminary_0.0.1_x64-setup.exe"
          Copy-Item $setup.FullName $older
          $env:LUMINARY_INSTALLER = $older
          $env:LUMINARY_HOST_SUPPORTED = "1"
          $refused = $null
          try { ./scripts/get-luminary.ps1 } catch { $refused = $_.Exception.Message }
          if ($refused -notlike "*0.0.1 is older*") { throw "expected the downgrade to be refused, got: $refused" }

      # The runners carry the Visual C++ runtime, so only this shows a clean machine lacks it.
      - name: Check every imported DLL ships or is part of Windows
        shell: pwsh
        run: ./scripts/desktop/verify_dll_imports.ps1 -Root "$env:LOCALAPPDATA\Luminary"

      # `|| true`: one root is missing and find would kill the step under -e.
      - name: Open the installed app
        run: |
          root="$(cygpath -u "$LOCALAPPDATA")"
          exe="$(find "$root/Luminary" "$root/Programs/Luminary" -maxdepth 1 -iname '*.exe' ! -iname 'uninstall*' 2>/dev/null | head -1 || true)"
          if [ -z "$exe" ]; then
            echo "no installed executable under $root -- what the installer left:"
            ls -la "$root/Luminary" "$root/Programs/Luminary" 2>&1 || true
            exit 1
          fi
          echo "installed at $exe"
          SCREENSHOT=build/windows.png bash scripts/desktop/verify_installed.sh "$exe"

      # Recorded to compare against the stage budget across runs.
      - name: Report installer size
        if: ${{ !cancelled() }}
        run: |
          du -sm build/stage | awk '{print "stage: " $1 "MB"}'
          ls -l src-tauri/target/release/bundle/nsis/*-setup.exe 2>/dev/null \
            | awk '{printf "%s: %.1fMB\n", $NF, $5/1048576}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: luminary-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          compression-level: 0

      # The log is on C:, the workspace on D:; upload-artifact needs one root.
      - name: Collect the app log
        if: always()
        run: |
          mkdir -p build
          cp -f "$(cygpath -u "$LOCALAPPDATA")/Luminary/Logs/luminary.log" build/ || true

      # After the log is collected: the uninstall removes it. The library the launch
      # built must survive; an uninstall is not consent to delete it. A file Luminary
      # did not write must survive too, and be listed with the command to delete it.
      - name: Uninstall through get-luminary.ps1
        shell: powershell
        run: |
          $mine = "$env:LOCALAPPDATA\Luminary\Logs\keep-me.txt"
          Set-Content $mine "not Luminary's"
          $env:LUMINARY_UNINSTALL = "1"
          $out = ./scripts/get-luminary.ps1 *>&1 | Out-String
          $out
          $left = @(Get-ChildItem "$env:LOCALAPPDATA\Luminary" -Recurse -Force -File | ForEach-Object { $_.FullName })
          if ($left.Count -ne 1 -or $left[0] -ne $mine) { throw "expected only $mine to be left, found: $left" }
          if ($out -notlike "*Remove-Item -LiteralPath '$env:LOCALAPPDATA\Luminary' -Recurse -Force*") { throw "the kept folder was not listed" }
          if ($out -notlike "*Remove-Item -LiteralPath '$env:LOCALAPPDATA\sh.luminary.app' -Recurse -Force*") { throw "the library's delete command was not shown" }
          if (Test-Path "$env:LOCALAPPDATA\sh.luminary.app\engine") { throw "left behind: the engine" }
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq "Luminary" }
          if ($entry) { throw "the Apps entry was left behind" }
          if (-not (Test-Path "$env:LOCALAPPDATA\sh.luminary.app")) { throw "the library was deleted" }

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luminary-windows-evidence
          path: |
            build/*.png
            build/*.log
            build/installed-app.out
          retention-days: 7

  # Each job uploads its installers only after every install check in it passed.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: luminary-{linux,windows}
          path: dist
          merge-multiple: true

      # A tag on an unbumped commit would ship an older build under a newer name.
      # The .sha256 files are what the get-luminary wrappers verify against.
      - name: Check versions and write checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          for suffix in "_amd64.deb" "_amd64.AppImage" "_x64-setup.exe"; do
            file="$(find dist -type f -name "Luminary_${version}${suffix}" | head -1)"
            [ -n "$file" ] || { echo "no Luminary_${version}${suffix} in the artifacts" >&2; exit 1; }
            cp "$file" out/
            (cd out && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done
          ls -l out

      # Three workflows fire on one tag; whichever finishes first creates the release,
      # and a create that loses the race falls back to the release the winner made.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes \
            || gh release view "$TAG" >/dev/null
          for attempt in 1 2 3; do
            if gh release upload "$TAG" out/* --clobber; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || break
            echo "upload attempt $attempt failed; retrying in $((attempt * 30))s" >&2
            sleep $((attempt * 30))
          done
          echo "release upload failed after 3 attempts" >&2
          exit 1
