name: Release macOS App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.3.0"
        required: true

permissions:
  contents: write

# Build and notarization are separate jobs on purpose. Apple's queue can stall
# for hours without acknowledging it, and a blocking wait inside the build job
# threw away a finished signed bundle every time it happened. Split, a stall
# costs a re-run of `notarize` alone -- the ~25 minute build is not repeated.
jobs:
  build:
    # macos-14 is Apple Silicon. macos-13 is Intel, and lancedb publishes no
    # macOS x86_64 wheel, so it cannot build this at all.
    runs-on: macos-14
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        run: sudo rm -rf /Users/runner/Library/Android "$RUNNER_TOOL_CACHE"/* || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The uv cache is the one that matters: with it warm, installing ~200
      # packages is mostly hardlinking. Do NOT cache the installed tree -- at
      # ~700MB compressed it would evict everything else from the 10GB budget.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache the standalone interpreter
        uses: actions/cache@v4
        with:
          path: build/pythons
          key: pbs-cpython-3.13.7-macos-aarch64-none

      - name: Install signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/macos/ci_keychain.sh

      - run: cd frontend && npm ci

      - name: Stage payload, runtime and inference server
        run: make stage

      - name: Verify the stage
        run: make verify-stage

      - name: Build Luminary.app
        run: make desktop-app

      - name: Sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/macos/sign.sh src-tauri/target/release/bundle/macos/Luminary.app

      # Before notarizing: a rejected submission costs a 10-30 minute round trip.
      - name: Verify the signature
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/macos/verify_signed.sh src-tauri/target/release/bundle/macos/Luminary.app

      # ditto, not upload-artifact's own zipping: that does not preserve
      # symlinks, permissions or resource forks, and a bundle that loses them
      # arrives with a broken signature.
      - name: Archive the signed app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/release/bundle/macos/Luminary.app \
            "$RUNNER_TEMP/Luminary-signed.zip"
          ls -lh "$RUNNER_TEMP/Luminary-signed.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-app
          path: ${{ runner.temp }}/Luminary-signed.zip
          retention-days: 7
          compression-level: 0

  notarize:
    needs: build
    runs-on: macos-14
    # Apple's scan scales with file count and this bundle has ~55k, twice over:
    # once for the app, once for the DMG.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Install signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/macos/ci_keychain.sh

      - name: Write notary API key
        run: echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/download-artifact@v4
        with:
          name: signed-app
          path: ${{ runner.temp }}/incoming

      - name: Restore the signed app
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release/bundle/macos
          ditto -x -k "$RUNNER_TEMP/incoming/Luminary-signed.zip" \
            src-tauri/target/release/bundle/macos
          # Transport must not have damaged the signature; catching it here
          # costs seconds, catching it at Apple costs a round trip.
          codesign --verify --deep --strict --verbose=2 \
            src-tauri/target/release/bundle/macos/Luminary.app

      # Before the DMG is built: a ticket only attaches to the artifact that was
      # submitted, so an app packaged first ships without one and needs a
      # network round trip to Apple on first launch.
      - name: Notarize and staple the app
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/macos/notarize.sh src-tauri/target/release/bundle/macos/Luminary.app

      - name: Build the DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/macos/dmg.sh src-tauri/target/release/bundle/macos/Luminary.app "${{ needs.build.outputs.version }}"

      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/macos/notarize.sh "build/dist/Luminary_${{ needs.build.outputs.version }}_aarch64.dmg"

      # Notary logs are the only way to see why a submission was rejected, so
      # keep them even when the job fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notary-logs
          path: build/dist/notary*.json
          if-no-files-found: ignore

      # Two workflows fire on the same tag -- this one and release.yml, which
      # builds the source tarball for headless installs. Whichever finishes
      # first creates the release; the other adds its assets. Creating
      # unconditionally made the slower job fail on an existing tag.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" build/dist/*.dmg --clobber
