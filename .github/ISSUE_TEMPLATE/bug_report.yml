name: "Bug Report"
description: "Report a bug or crash in Luminary"
title: "[Bug]: "
labels: ["bug", "status/needs-triage"]
body:
  - type: textarea
    id: bug_desc
    attributes:
      label: "What happened & how to reproduce?"
      description: "A clear description of the bug and the steps to reproduce it."
      placeholder: |
        e.g., I uploaded a PDF and clicked on the 'Study' tab, but the app crashed.
        Steps:
        1. Click Upload.
        2. Open Study page...
    validations:
      required: true
  - type: textarea
    id: env_info
    attributes:
      label: "Environment Details"
      description: |
        Paste the whole block — it saves a round trip asking for it.

        **Desktop app:** Settings → Report an issue fills this in for you (it
        redacts paths and keys first). From the startup screen, use "Report a
        problem".

        **Command-line install:** run `luminary status`.

        **From a checkout, or if neither works:** paste the output of
        `sw_vers && uname -srm && ollama --version && ollama list`, plus how you
        installed Luminary and which version.
      render: text
      placeholder: |
        version   0.3.3
        os        macOS 26.4.1 (build 25E253)
        kernel    Darwin 25.4.0 arm64
        ollama    running — 0.32.3
                  llama3.2:latest
                  qwen2.5vl:7b
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Error Logs or Screenshots"
      description: |
        Desktop app: `~/Library/Logs/Luminary/luminary.log`, or Settings →
        Report an issue, which attaches the tail for you.
        Command-line install: `luminary logs`.
        From a checkout: the terminal output of `make dev`.
      placeholder: "Paste backend/frontend log outputs..."
    validations:
      required: false
