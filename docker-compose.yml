services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Audio/video ingestion (MP4, YouTube). Off by default because it
        # installs GPL components; see the Dockerfile. Turn on with
        # `WITH_MEDIA=1 docker compose --profile ai up --build`.
        WITH_MEDIA: ${WITH_MEDIA:-0}
    ports:
      # Loopback-only. The API has no authentication, so publishing on all host
      # interfaces exposed the full library to whatever network the machine was
      # on (cafe wifi, hotel wifi, office VLAN).
      - "127.0.0.1:7820:7820"
    volumes:
      - luminary-data:/data
    # A full shutdown takes ~10.8s: the FastAPI lifespan finishes fast, then the
    # process drains an unawaited LiteLLM coroutine before the interpreter exits.
    # Compose's default grace is 10s, so Ctrl-C here landed on either side of the
    # boundary at random -- exit 0 on one run, SIGKILL (137) on the next, with the
    # Kuzu lock left held. Do not lower this below the measured number.
    stop_grace_period: 30s
    environment:
      - LUMINARY_MODE=public
      - DATA_DIR=/data
      # Without this, Python buffers stdout when it is a pipe, so `docker logs`
      # lags the work it is describing -- which is how a bug report arrives with
      # the interesting lines missing.
      - PYTHONUNBUFFERED=1
      # No OMP_NUM_THREADS / MKL_NUM_THREADS cap here, deliberately. Bounding
      # PyTorch to 4 threads was proposed as the highest-impact laptop fix and
      # measured the other way: on a 12-vCPU container, the same PDF ingested in
      # 137s/139s unbounded against 179s/181s at 4 threads -- about 30% slower,
      # two runs each. Embedding and NER are batched tensor work over thousands
      # of chunks, which uses the threads; the spin-wait contention story fits
      # small ops, not this. Set them yourself if you want Luminary to leave
      # cores for something else.
      # Point the backend at the ollama service. The backend reads OLLAMA_URL
      # (NOT OLLAMA_HOST); its default 127.0.0.1 would resolve to this container.
      #
      # Interpolated, not hardcoded: `make docker-run-host-ollama` exports
      # OLLAMA_URL=http://host.docker.internal:11434 to move inference onto the
      # host. Hardcoded, that export was accepted by the shell and silently
      # discarded here -- the container still dialled the `ollama` service name,
      # which in that topology does not exist.
      #
      # Both make targets pass this explicitly, so an OLLAMA_URL exported for a
      # native `make dev` (127.0.0.1 -- the container's own loopback) cannot leak
      # in. A raw `docker compose --profile ai up` in such a shell still can.
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      # Must match the ollama service: the backend sizes its semaphore from it.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      # Without these the app never learned which model `ollama-pull` below
      # actually pulled -- it fell back to its own hardcoded default, silently
      # correct only while that happens to match ollama-pull's default too.
      # Set with the ollama/ prefix (config.py's own convention); ollama-pull
      # strips it defensively either way.
      - LITELLM_DEFAULT_MODEL=${LITELLM_DEFAULT_MODEL:-ollama/qwen3.5:4b}
      # A plain default, not ${VISION_MODEL:-${LITELLM_DEFAULT_MODEL:-...}}.
      # Nested interpolation is not supported by older Compose, which passes the
      # inner expression through verbatim -- a reported 0.7.6 log shows the app
      # receiving the literal string:
      #
      #   vision was configured as ${LITELLM_DEFAULT_MODEL:-ollama/qwen3.5:4b}
      #
      # It degraded gracefully because the router falls back, but the value was
      # never a model id. Overriding LITELLM_DEFAULT_MODEL no longer moves this
      # with it: set VISION_MODEL too if you want them to match.
      - VISION_MODEL=${VISION_MODEL:-ollama/qwen3.5:4b}
    # No `required: false` here. It is valid Compose Spec, and it is what would
    # make the default profile a valid project -- but Compose only understands
    # it from v2.20-ish, and v2.29.7 accepts it while older daemons reject the
    # whole file with:
    #
    #   services.app.depends_on.ollama Additional property required is not allowed
    #
    # Validating against one machine's Compose is not validating the file. The
    # documented path is `docker compose --profile ai up`, where both services
    # exist and neither flag is needed.
    depends_on:
      ollama:
        condition: service_started
      # Wait for the model, not just for Ollama. These started in parallel, so
      # on a first run the app warmed up against an empty Ollama and logged
      # `model 'qwen3.5:4b' not found` -- the chat model reported missing on a
      # fresh install until something retried. ollama-pull is idempotent and
      # always exits 0, so this cannot wedge startup.
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
      - ""
      - ai

  ollama:
    image: ollama/ollama:latest
    # Deliberately NOT published to the host. Nothing needs it there: the app
    # reaches Ollama at http://ollama:11434 over the compose network, and so
    # does ollama-pull. Publishing it only created a failure mode -- anyone who
    # already runs Ollama natively, which is most people who have heard of it,
    # got `bind: address already in use` from the Docker daemon and no guidance.
    # For the CLI against this container: `docker compose exec ollama ollama ls`.
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # A floor, not a guess -- the same reasoning as OLLAMA_NUM_PARALLEL below.
      # Two resident models let enrichment keep a reader loaded beside the chat
      # model instead of thrashing between them, and that is right on a host
      # with the memory for it. Compose cannot measure the host, and the backend
      # on a small one resolves to `low`, which keeps ONE model resident -- so
      # the default here disagreed with the profile the app had already chosen.
      # Raise it to 2 on a host with 16GB+ available to the container.
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      # A floor, not a guess: compose cannot measure the host and each slot
      # costs a full KV cache. Set OLLAMA_NUM_PARALLEL=2 on a 24GB+ host.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      # Residency has to be set here. The backend cannot: LiteLLM's `ollama/`
      # completion path folds keep_alive into `options`, where Ollama rejects
      # it, so a per-call value never applied and the model unloaded on
      # Ollama's own 5-minute default -- paying a full reload on a machine
      # where a reload is measured in tens of seconds.
      #
      # 30m and not -1, deliberately. On a host without GPU acceleration a load
      # is the largest thing a question waits on -- measured on an Intel
      # i7-8850H in a 12GB VM, qwen3.5:4b loads in 9.6s-155s, and one question
      # spent 86 of its 261 seconds there -- but -1 pins 3.4GB for as long as
      # Ollama runs, which is the wrong trade on a host that loads in seconds.
      # Compose cannot tell those apart. The backend can and does: it times a
      # real load at start-up and keeps the model warm only where that
      # measurement says a load is expensive (I-37). Set OLLAMA_KEEP_ALIVE=-1
      # yourself to take eviction off the table regardless.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Ollama leaves llama.cpp's prompt cache at 8192 MiB on every host --
      # measured, not inferred: unset reports "size limit: 8192 MiB", which on a
      # 7.8GB Docker VM is a larger allowance than the whole machine. It is a
      # cap, not a reservation, but a reported run reached 1039 MiB of it.
      #
      # 512 MiB is bracketed by two measured cases: a real prompt's saved state
      # is 105-206 MiB, so this holds the two or three recent prompts that reuse
      # actually draws on, while the default exceeds the entire VM. Not zero,
      # because on a non-hybrid model the cache genuinely works -- qwen3.5 is
      # hybrid/recurrent, so llama.cpp re-processes every prompt regardless
      # ("forcing full prompt re-processing due to lack of cache data") and the
      # allowance buys nothing there.
      - LLAMA_ARG_CACHE_RAM=${LLAMA_ARG_CACHE_RAM:-512}
    restart: unless-stopped
    profiles:
      - ai

  # One-shot: pull the default chat model into the ollama volume on first run,
  # then exit. Without this the sidecar starts empty and chat/generation fail.
  # OLLAMA_HOST here is the ollama CLI's own variable (where the server lives).
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint:
      - sh
      - -c
      # `$$` is an escaped `$`: compose interpolates every bare `${...}` itself
      # before the shell runs, and `${M#ollama/}` is not a form it accepts -- it
      # failed the whole file with "invalid interpolation format". Only
      # LITELLM_DEFAULT_MODEL is meant for compose to substitute, from the host
      # env or .env; M is the shell's and stays escaped.
      # Idempotent and always exit 0. Both matter now that `app` waits for this
      # to finish: a re-pull of a cached model fails with no network, and
      # exiting non-zero there would stop the app from starting at all -- on a
      # machine that has the model and would have worked offline.
      - 'M="${LITELLM_DEFAULT_MODEL:-qwen3.5:4b}"; M="$${M#ollama/}"; until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 2; done; if ollama list | grep -q "^$$M[[:space:]]"; then echo "$$M already present"; else echo "pulling $$M"; ollama pull "$$M" || echo "pull failed -- the app will start and report the model as missing"; fi; exit 0'
    restart: "no"
    profiles:
      - ai

volumes:
  luminary-data:
  ollama-models:
